<!doctype html>
<meta charset="utf-8">
<title>app export check</title>
<body>
<pre id="out">running</pre>
<iframe id="f" src="/index.html" style="width:1400px;height:900px"></iframe>
<script type="module">
// Loads the real index.html, stubs ONLY the GitHub API, then clicks the page's
// own Download button. This exercises the shipped renderPngBlob, not a copy.
const out = { steps: [] }
const AV = 'https://avatars.githubusercontent.com/u/105237183?v=4'
const note = (s, x) => out.steps.push(Object.assign({ step: s }, x || {}))
const now = Date.now()

const mk = (sha, subject, ago, add, del) => ({
  sha: sha.repeat(40),
  shortSha: sha.repeat(7),
  subject: subject,
  author: 'a',
  committedAt: now - ago,
  files: 3,
  additions: add,
  deletions: del,
  paths: ['a.ts'],
})

const commits = [
  mk('a', 'feat: pooled card', 3600e3, 120, 30),
  mk('b', 'fix: return path', 7200e3, 26, 1),
]

const reply = (body) =>
  new Response(JSON.stringify(body), {
    status: 200,
    headers: { 'content-type': 'application/json' },
  })

const frame = document.getElementById('f')
await new Promise((r) => (frame.onload = r))
note('app-loaded')

const win = frame.contentWindow
const passthrough = win.fetch.bind(win)

// The app talks to the broker via absolute API_BASE, and the module captured
// `fetch` at load, so patching win.fetch after onload is too late. Intercept at
// the network layer instead: the broker's own origin, which is what the page hits.
const BROKER = 'https://commitcard-gray.vercel.app'
const RealFetch = win.fetch

const fake = async (u) => {
  const url = String(u)
  if (u.includes('user/repos')) {
    const r = { full_name: 'iamtyroon/commitcard', name: 'commitcard' }
    r.owner = { login: 'iamtyroon' }
    r.private = false
    r.pushed_at = new Date().toISOString()
    return reply([r])
  }
  if (url.includes('/commits?')) {
    return reply(commits.map((c) => ({ sha: c.sha })))
  }
  if (url.includes('/commits/')) {
    const sha = url.split('/commits/')[1].split('?')[0]
    const src = commits.find((c) => c.sha === sha) || commits[0]
    const iso = new Date(src.committedAt).toISOString()
    const body = { sha: src.sha, author: { avatar_url: AV } }
    body.files = [{ filename: 'a.ts', additions: src.additions, deletions: src.deletions }]
    body.commit = { message: src.subject, author: { name: 'a', date: iso } }
    body.commit.committer = { date: iso }
    return reply(body)
  }
  if (url.endsWith('/user')) return reply({ login: 'iamtyroon', name: 'T', avatar_url: AV })
  const meta = { name: 'commitcard', default_branch: 'main' }
  meta.owner = { login: 'iamtyroon', avatar_url: AV }
  return reply(meta)
}

// Only the broker's API calls are faked. Data/blob URLs and the avatar fetch must
// still hit the network, or the export would pass for the wrong reason.
win.fetch = (url, opts) => {
  const u = String(url)
  if (u.startsWith(BROKER)) return fake(u)
  if (u.startsWith('data:') || u.startsWith('blob:')) return RealFetch(url, opts)
  return RealFetch(url, opts)
}

const doc = frame.contentDocument
doc.getElementById('repo').value = 'iamtyroon/commitcard'
doc.getElementById('range').value = '7d'
doc.getElementById('form').dispatchEvent(new win.Event('submit', { cancelable: true }))

for (let i = 0; i < 40; i++) {
  await new Promise((r) => setTimeout(r, 250))
  if (doc.getElementById('dl').disabled === false) break
}
note('generated', {
  status: doc.getElementById('status').textContent,
  enabled: !doc.getElementById('dl').disabled,
})

doc.getElementById('dl').click()
await new Promise((r) => setTimeout(r, 3000))
const finalStatus = doc.getElementById('status').textContent
note('after-download', { status: finalStatus })
out.ok = !/^Could not build/.test(finalStatus)
document.getElementById('out').textContent = JSON.stringify(out, null, 1)
</script>
