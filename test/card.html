<!doctype html>
<meta charset="utf-8">
<style>
  :root{
    --bg:#010409;--panel:#0d1117;--border:#30363d;--hair:#21262d;--text:#e6edf3;
    --muted:#7d8590;--add:#3fb950;--del:#f85149;--accent:#79c0ff;
    --accentBg:rgba(31,111,235,.2);--accentBorder:#316dca;--empty:#21262d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1600px;height:900px;background:var(--bg);
    font:400 15px/1.5 -apple-system,Segoe UI,Inter,Roboto,Helvetica,Arial,sans-serif;color:var(--text);
    display:flex;align-items:stretch;justify-content:center;padding:56px}
  .wrap{width:100%;max-width:1488px;display:flex;flex-direction:column;height:100%}
  .head{display:flex;align-items:center;gap:14px;padding:16px 22px;background:var(--panel);
    border:1px solid var(--border);border-bottom:0;border-radius:14px 14px 0 0}
  .av{width:34px;height:34px;border-radius:50%;flex:0 0 auto;object-fit:cover;
    background:var(--accentBg);border:1px solid var(--accentBorder)}
  .av.ph{display:grid;place-items:center;font:700 15px Consolas,"SF Mono",Menlo,monospace;color:var(--accent)}
  .htitle{font-weight:600;font-size:16px;line-height:1.25}
  .hsub{color:var(--muted);font-size:12.5px;line-height:1.35}
  .pill{background:var(--accentBg);border:1px solid var(--accentBorder);color:var(--accent);
    border-radius:2em;padding:3px 13px;font:600 13px Consolas,"SF Mono",Menlo,monospace}
  .spacer{flex:1}
  .handle{color:var(--muted);font-size:13px}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:0 0 14px 14px;
    padding:20px 22px 18px;flex:1;display:flex;flex-direction:column}
  .statrow{display:flex;align-items:center;justify-content:space-between;height:30px}
  .statrow.sub{border-top:1px dashed var(--hair);margin-top:6px;padding-top:10px;height:auto}
  .statrow .files{font-weight:600;font-size:16px}
  .statrow.sub .files{color:var(--muted);font-weight:400;font-size:14px}
  .cap{display:inline-block;color:var(--muted);font:600 11px -apple-system,Segoe UI,Inter,Roboto,Helvetica,Arial,sans-serif;
    text-transform:uppercase;letter-spacing:.07em;margin-right:12px}
  .nums{display:flex;align-items:center;gap:10px;font:600 17px Consolas,"SF Mono",Menlo,monospace}
  .blocks{display:inline-flex;gap:4px;margin-left:4px}
  .blk{width:10px;height:10px;border-radius:3px;display:inline-block}
  .blk.del{background:var(--del)}
  table{width:100%;border-collapse:collapse;margin-top:16px;table-layout:fixed}
  th{text-align:left;color:var(--muted);font:600 11px -apple-system,Segoe UI,Inter,Roboto,Helvetica,Arial,sans-serif;text-transform:uppercase;
    letter-spacing:.07em;padding:0 10px 9px;border-bottom:1px solid var(--border)}
  td{padding:9px 10px;border-bottom:1px solid var(--hair);height:58px;vertical-align:middle}
  th.r,td.n{text-align:right;width:86px}
  .t{color:var(--muted);font:12.5px Consolas,"SF Mono",Menlo,monospace;width:52px}
  .sha{color:var(--accent);font:12.5px Consolas,"SF Mono",Menlo,monospace;width:78px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .msg{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tag{margin-left:8px;background:var(--accentBg);border:1px solid var(--accentBorder);
    color:var(--accent);border-radius:2em;padding:1px 8px;font:600 10px -apple-system,Segoe UI,Inter,Roboto,Helvetica,Arial,sans-serif;
    text-transform:uppercase;letter-spacing:.05em;vertical-align:1px}
  .histo{display:flex;align-items:flex-end;gap:6px;height:78px;margin-top:16px;
    padding:0 4px;border-bottom:1px solid var(--border)}
  .hcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;flex:1}
  .hbar{width:100%;max-width:38px;background:var(--accent);border-radius:3px 3px 0 0;opacity:.85}
  .hday{color:var(--muted);font:11px Consolas,"SF Mono",Menlo,monospace}
  .foot{margin-top:auto;padding-top:14px;color:var(--muted);font-size:11.5px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
</style>
<div class="wrap">
  <div class="head">
    <img class="av" src="https://avatars.githubusercontent.com/u/105237183?v=4" alt="">
    <div>
      <div class="htitle">commitcard</div>
      
    </div>
    <span class="spacer"></span>
    <span class="pill">main</span>
    <span class="handle">@iamtyroon</span>
  </div>
  <div class="panel">
    
    <div class="statrow">
      <div class="l"><span class="files">9 files changed</span></div>
      <div class="nums">
        <span class="add">+120</span>
        <span class="del">-36</span>
        <span class="blocks"><i class="blk add" style="background:var(--add)"></i><i class="blk add" style="background:var(--add)"></i><i class="blk add" style="background:var(--add)"></i><i class="blk add" style="background:var(--add)"></i><i class="blk del"></i></span>
      </div>
    </div>
    
    
    <table>
      <thead><tr><th>Time</th><th>Commit</th><th>Subject</th>
        <th class="r">Files</th><th class="r">Added</th><th class="r">Removed</th></tr></thead>
      <tbody>
    <tr>
      <td class="t">13:00</td>
      <td class="sha">aaaaaaa</td>
      <td class="msg">feat: thing</td>
      <td class="n">3</td>
    <td class="n add">+40</td>
      <td class="n del">-12</td>
    </tr>
    <tr>
      <td class="t">13:00</td>
      <td class="sha">bbbbbbb</td>
      <td class="msg">feat: thing</td>
      <td class="n">3</td>
    <td class="n add">+40</td>
      <td class="n del">-12</td>
    </tr>
    <tr>
      <td class="t">13:00</td>
      <td class="sha">ccccccc</td>
      <td class="msg">feat: thing</td>
      <td class="n">3</td>
    <td class="n add">+40</td>
      <td class="n del">-12</td>
    </tr></tbody>
    </table>
    <div class="foot">Totals across 3 commits · 7 days.</div>
  </div>
</div>
