<!doctype html>
<meta charset="utf-8">
<title>export harness</title>
<body>
<div id="host"></div>
<pre id="result">running…</pre>
<script type="module">
// Drives the page's real export path (renderPngBlob) against a known card, with no
// network and no clipping by the automation sandbox, and prints the outcome so a
// harness can read why an export failed instead of guessing.
import { renderCard } from '../src/render.mjs'

const c = (o) => ({
  sha: 'a'.repeat(40), shortSha: 'aaaaaaa', subject: 'feat: thing', author: 'a',
  committedAt: Date.parse('2026-09-30T10:00:00Z'), files: 3, additions: 40,
  deletions: 12, paths: ['a.ts'], ...o,
})
const commits = [c({}), c({ shortSha: 'bbbbbbb' }), c({ shortSha: 'ccccccc' })]
const html = renderCard({
  commits, repoName: 'commitcard', branch: 'main', label: '7 days', tz: 3,
  avatar: 'https://avatars.githubusercontent.com/u/105237183?v=4',
  handle: '@iamtyroon', theme: 'dark', preset: 'twitter', maxRows: 8,
})

const out = { steps: [] }
const note = (s, extra) => { out.steps.push(Object.assign({ step: s }, extra)); }

try {
  const frame = document.createElement('iframe')
  frame.style.cssText = 'width:1600px;height:900px;border:0'
  frame.srcdoc = html
  document.getElementById('host').appendChild(frame)
  await new Promise((r) => (frame.onload = r))
  const doc = frame.contentDocument
  const wrap = doc.querySelector('.wrap')
  note('frame-loaded', { hasWrap: !!wrap })

  const style = html.match(/<style>([\s\S]*?)<\/style>/)[1]
  const w = 1600, h = 900, scale = 2
  const clone = wrap.cloneNode(true)
  const imgs = [...clone.querySelectorAll('img')]
  let inlined = 0, dropped = 0
  for (const img of imgs) {
    try {
      const blob = await (await fetch(img.src)).blob()
      img.src = await new Promise((res) => {
        const fr = new FileReader()
        fr.onload = () => res(fr.result)
        fr.readAsDataURL(blob)
      })
      inlined++
    } catch (e) { img.remove(); dropped++ }
  }
  note('images-inlined', { total: imgs.length, inlined, dropped })

  const inner =
    '<div xmlns="http://www.w3.org/1999/xhtml" style="width:' + w + 'px;height:' + h + 'px">' +
    '<style>' + style + '</style>' + clone.outerHTML + '</div>'
  const svg =
    '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '">' +
    '<foreignObject width="100%" height="100%">' +
    '<div xmlns="http://www.w3.org/1999/xhtml" style="width:' + w + 'px;height:' + h + 'px">' +
    '<style>' + style + '</style>' +
    clone.outerHTML.replace(/<(img|br|hr|source|wbr)\b([^>]*?)\/?>/g, '<$1$2/>') +
    '</div></foreignObject></svg>'

  // Narrow the failure: which of these three cannot be loaded as an image?
  const tryLoad = async (label, markup) => {
    const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(markup)
    const im = new Image()
    try {
      await new Promise((res, rej) => {
        im.onload = res
        im.onerror = () => rej(new Error(label + ' failed'))
        im.src = url
      })
      note('variant-ok', { label })
      return im
    } catch (e) {
      note('variant-fail', { label, error: e.message })
      return null
    }
  }

  // Bisect the content: style only, markup only, and a few likely culprits.
  const wrapOnly =
    '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '">' +
    '<foreignObject width="100%" height="100%">' +
    '<div xmlns="http://www.w3.org/1999/xhtml">' +
    // Same repair the page performs: HTML serialisation drops the closing slash on
    // void elements, and strict XML rejects them.
    clone.outerHTML.replace(/<(img|br|hr|source|wbr)\b([^>]*?)\/?>/g, '<$1$2/>') +
    '</div>' +
    '</foreignObject></svg>'
  const styleOnly =
    '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '">' +
    '<foreignObject width="100%" height="100%">' +
    '<div xmlns="http://www.w3.org/1999/xhtml" style="width:' + w + 'px;height:' + h + 'px">' +
    '<style>' + style + '</style></div></foreignObject></svg>'

  let img = await tryLoad('full-card', svg)
  if (!img) img = await tryLoad('markup-only', wrapOnly)
  if (!img) img = await tryLoad('style-only', styleOnly)
  if (!img) {
    // Ask the XML parser directly what it dislikes — that is the same parser the
    // SVG image path uses, and it names the offending line.
    const doc = new DOMParser().parseFromString(
      '<svg xmlns="http://www.w3.org/2000/svg">' + inner + '</svg>',
      'image/svg+xml',
    )
    const err = doc.querySelector('parsererror')
    note('xml-parsererror', { text: err ? err.textContent.slice(0, 400) : 'none' })
  }
  if (!img) {
    // The real card contains these; test each alone.
    const one = (inner) =>
      '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '">' +
      '<foreignObject width="100%" height="100%">' +
      '<div xmlns="http://www.w3.org/1999/xhtml" style="width:' + w + 'px;height:' + h + 'px">' +
      '<style>' + style + '</style>' + inner + '</div></foreignObject></svg>'
    img = await tryLoad('avatar-only',
      one('<img src="' + clone.querySelector('img').src + '" style="width:34px;height:34px;border-radius:50%">'))
    if (!img) img = await tryLoad('table-only', one('<table><tr><td>x</td></tr></table>'))
    if (!img) img = await tryLoad('plain-div', one('<div style="color:#fff">hello</div>'))
  }
  if (!img) throw new Error('SVG did not load (even bare markup fails)')
  note('svg-loaded')

  const canvas = document.createElement('canvas')
  canvas.width = w * scale
  canvas.height = h * scale
  const ctx = canvas.getContext('2d')
  ctx.scale(scale, scale)
  ctx.drawImage(img, 0, 0)
  let tainted = false
  try { ctx.getImageData(0, 0, 1, 1) } catch { tainted = true }
  note('drawn', { tainted })

  const blob = await new Promise((r) => canvas.toBlob(r, 'image/png'))
  note('toBlob', { nullBlob: blob === null, bytes: blob ? blob.size : 0 })

  // Prove the avatar actually rasterised: sample the header where it sits. If the
  // inline failed silently the corner would be the panel colour, not the border.
  const probe = ctx.getImageData(30 * scale, 18 * scale, 1, 1).data
  note('avatar-pixel', { r: probe[0], g: probe[1], b: probe[2], a: probe[3] })

  // Text colour: the exported markup must not fall back to black on a dark card,
  // which happens when the body's `color` is dropped with the un-cloned body.
  const textPixel = ctx.getImageData(200 * scale, 120 * scale, 1, 1).data
  note('text-pixel', { r: textPixel[0], g: textPixel[1], b: textPixel[2] })
  const bitmap = await createImageBitmap(blob)
  note('bitmap', { w: bitmap.width, h: bitmap.height })
  out.ok = !!blob
} catch (e) {
  out.ok = false
  out.error = (e && e.name) + ': ' + (e && e.message)
}
document.getElementById('result').textContent = JSON.stringify(out, null, 1)
</script>
